# ============================================================================
# Parscoders adapter configuration
# ----------------------------------------------------------------------------
# If Parscoders changes its markup, edit THIS file (not Python code):
#   1. open https://parscoders.com/project in a browser
#   2. inspect one project card -> copy the CSS selector of the card container
#   3. do the same for title / link / budget / description / skills
#   4. repeat on a project page for the bid form selectors
# Selector lists are tried in order, the first match wins.
# ============================================================================

base_url: "https://parscoders.com"

discovery:
  # ai        = مدل خودش داخل سایت می‌گردد و صفحه‌ی هر پروژه را می‌خواند
  # selectors = فقط سلکتورهای CSS همین فایل (سریع، بدون مصرف کلید AI)
  # auto      = اگر کلید هوش مصنوعی بود ai، وگرنه selectors
  mode: "selectors"
  # فقط از صفحه‌ی اصلی شروع می‌کنیم؛ پیدا کردن فهرست‌ها کار خود مدل است
  seed_paths: ["/"]
  max_steps: 8               # حداکثر صفحه‌ای که در یک دور باز می‌شود
  max_detail_pages: 4        # حداکثر صفحه‌ی پروژه که کامل خوانده می‌شود
  max_projects: 4            # سقف پروژه‌های جمع‌آوری‌شده در هر دور
  page_delay_seconds: 1      # فاصله بین درخواست‌ها (مؤدبانه و شبیه انسان)
  # نتیجه‌ی جست‌وجوی قبلی تا این مدت دوباره استفاده می‌شود تا سهمیه‌ی رایگان نسوزد
  reuse_seconds: 600
  # سقف توکن در دقیقه؛ کلاینت مدل قبل از هر درخواست خودش صبر می‌کند تا 429 نگیریم
  tokens_per_minute: 7000
  brief: |
    این سایت «پارس‌کدرز» است و تو با حساب کاربری همین فریلنسر وارد شده‌ای.

    ساختار معمول این سایت:
    - برای هر فریلنسر (معمولاً) دو فهرست پروژه وجود دارد: یکی پروژه‌هایی که با
      تخصص ثبت‌شده در پروفایل او هم‌خوان است، و دیگری همه‌ی پروژه‌های باز.
      لینک هر دو در ناوبری/داشبورد هست (با برچسب‌هایی مثل «پروژه‌ها»،
      «پروژه‌های مرتبط»، «همه پروژه‌ها»، «پروژه‌های باز»). اول فهرست مرتبط با
      تخصص را پیدا کن؛ اگر نبود یا کوتاه بود، فهرست همه‌ی پروژه‌های باز را هم ببین.
    - صفحه‌ی پروفایل من (نام کاربری/آواتار در هدر) تخصص‌ها، مهارت‌ها و دسته‌های
      ثبت‌شده را نشان می‌دهد. اگر به آن رسیدی بخوانش تا بدانی چه چیزی «مرتبط» است؛
      لازم نیست همه‌ی پروژه‌های آن صفحه را جمع کنی.
    - هر کارت پروژه معمولاً عنوان، بودجه/حق‌الزحمه، زمان تحویل و مهارت‌ها را دارد.
    - صفحه‌ی هر پروژه توضیحات کامل کارفرما، بودجه، مدت زمان مورد نظر کارفرما،
      مهارت‌های لازم، تعداد پیشنهادهای ثبت‌شده و وضعیت پروژه را دارد.
    - پروژه‌های بسته/واگذارشده را جمع نکن؛ فقط پروژه‌های باز و قابل پیشنهاد.

    قاعده‌ی انتخاب: پروژه‌ای جمع کن که (۱) هنوز باز است، (۲) با مهارت‌های همین
    پروفایل هم‌خوانی دارد، و (۳) بودجه‌اش یا اعلام شده یا «توافقی» است. اگر بودجه
    در صفحه نبود، خالی بگذار — عدد از خودت نساز.

# --- listing page -----------------------------------------------------------
list:
  path: "/project"
  # query string appended to the list URL, e.g. {page: 2} -> ?page=2
  page_param: "page"
  max_pages: 1
  # card containers on the listing page
  card_selectors:
    - "div.project-list-item"
    - "div.project-row"
    - "div.card.project"
    - "article.project"
    - "li.project-item"
    - "table.project-list tr"
  fields:
    title:
      - "h2 a"
      - ".project-title a"
      - "a.project-title"
      - "a[href*='/project/']"
    link:
      - "h2 a"
      - ".project-title a"
      - "a.project-title"
      - "a[href*='/project/']"
    description:
      - ".project-description"
      - "div.description"
      - "p.description"
      - ".summary"
    budget:
      - ".project-budget"
      - ".budget"
      - "[class*='budget']"
      - "[class*='price']"
    skills:
      - ".project-skills .tag"
      - ".tags .tag"
      - ".skills li"
      - ".skill"
      - "a[href*='/project/skills/']"
    category:
      - ".project-category"
      - ".category"
    employer:
      - ".employer"
      - ".project-owner"
      - ".user-name"
    published_at:
      - ".project-date"
      - "time"
      - ".date"
  id_regex: "/projects?/(\\d+)"
  # Detail pages are fetched lazily ("on_demand"): only for projects that
  # already passed the filters. Eagerly opening all ~25 project pages on
  # every poll made ParsCoders disconnect/throttle the client
  # (RemoteProtocolError) and drowned the logs. "eager" restores the old
  # behaviour; "off" never fetches detail pages.
  detail_mode: "on_demand"
  detail_concurrency: 2

# --- HTTP politeness ----------------------------------------------------------
http:
  get_attempts: 3
  # jittered pause before each detail-page request (seconds, ±50%)
  request_delay_seconds: 0.7

detail:
  path: "/project/{external_id}"
  # Reuse successful project detail HTML across poll cycles; submission pages are always fetched fresh.
  cache_seconds: 900
  # A bid-status check may reuse detail HTML fetched within this window
  # (same poll cycle) instead of downloading the page a second time.
  status_reuse_seconds: 120
  detail_fields:
    description:
      - "#project-description"
      - ".project-description"
      - ".project-detail .description"
      - "div.description"
    budget:
      - ".project-budget"
      - ".budget"
      - "[class*='budget']"
    skills:
      - ".project-skills .tag"
      - ".skills .tag"
      - "li.skill"
      - "a[href*='/project/skills/']"
    category:
      - ".project-category"
    employer:
      - ".project-owner"
      - ".employer"

# --- bidding ----------------------------------------------------------------
bid:
  mode: "form"           # "form" = parse & POST the real HTML form
  browser_submit: true  # Use the site's JavaScript form in Chromium when the form has no native action.
  # form on the project page that submits a proposal
  # VERIFIED on the live DOM (2026-10-25, `bidpilot inspect` on project
  # 621237): the real bid form has NO action/method (JS submits it) and
  # carries _token + bidAmount + deadline + initEscrowPercent +
  # expertGuaranteePercent + validDays + message. The :has() selector pins
  # exactly that form; the generic selectors below stay as fallbacks.
  form_selectors:
    - "form:has(input[name='bidAmount'])"
    - "form#bid-form"
    - "form#proposal-form"
    - "form[action*='bid']"
    - "form[action*='proposal']"
    - "form[action*='offer']"
    - ".bid-form form"
  # where each value goes inside that form (exact live names first)
  fields:
    amount:
      - "input[name='bidAmount']"
      - "input[name*='amount']"
      - "input[name*='price']"
      - "input[name*='budget']"
      - "input[name*='offer']"
    description:
      - "textarea[name='message']"
      - "textarea[name*='description']"
      - "textarea[name*='proposal']"
      - "textarea[name*='content']"
      - "textarea[name*='message']"
      - "textarea"
    days:
      - "input[name='deadline']"
      - "input[name*='day']"
      - "input[name*='delivery']"
      - "input[name*='duration']"
      - "select[name*='day']"
  include_hidden: true
  headers:
    X-Requested-With: "XMLHttpRequest"
    Accept: "application/json, text/javascript, */*; q=0.01"
  success_text_contains:
    - "پیشنهاد شما با موفقیت ثبت شد"
    - "پیشنهاد با موفقیت ثبت شد"
    - "پیشنهاد شما ثبت شد"
  failure_text_contains:
    - "قبلاً پیشنهاد"
    - "قبلا پیشنهاد"
    - "اعتبار کافی"
    - "امکان ارسال"
    - "مجاز نیست"
    - "وارد شوید"
  # optional: a URL to GET before submitting (e.g. a CSRF-refresh endpoint)
  pre_submit_get: ""

# --- auth -------------------------------------------------------------------
auth:
  mode: "cookie"           # "cookie" (PARSOCODERS_COOKIE / settings store) or "credentials"
  login_path: "/login"
  username_field: "username"
  password_field: "password"
  cookie_name: "PHPSESSID"
  # --- checking the saved session (used by /test and after setup) -------------
  # صفحه‌ای که فقط کاربر لاگین‌شده می‌بیند؛ اگر پیدا نشد، صفحه‌ی اصلی امتحان می‌شود.
  check_path: "/dashboard"
  # «حساب کاربری» is also present on login pages, so it is not proof of authentication.
  logged_in_markers: ["خروج از حساب", "داشبورد", "پروفایل من", "پنل کاربری"]
  login_markers: ["ورود به حساب", "فراموشی رمز", "بازیابی رمز"]
  require_auth_markers: true
