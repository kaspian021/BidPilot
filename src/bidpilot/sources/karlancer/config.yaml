# ============================================================================
# Karlancer (karlancer.com) — selectors only, no code.
# ----------------------------------------------------------------------------
# کالیبره‌کردن سلکتورها (وقتی سایت ظاهرش را عوض کرد):
#   bidpilot inspect -u https://karlancer.com/projects
#   bidpilot inspect -f data/debug/<page>.html --no-save
# سپس سلکتور درست را در همین فایل جایگزین کن — بدون تغییر کد.
# ============================================================================

base_url: "https://karlancer.com"

discovery:
  # ai        = مدل خودش داخل سایت می‌گردد و صفحه‌ی هر پروژه را می‌خواند
  # selectors = فقط سلکتورهای CSS همین فایل (سریع، بدون مصرف کلید AI)
  # auto      = اگر کلید هوش مصنوعی بود ai، وگرنه selectors
  mode: "auto"
  # فقط از صفحه‌ی اصلی شروع می‌کنیم؛ پیدا کردن فهرست‌ها کار خود مدل است
  seed_paths: ["/"]
  max_steps: 8               # حداکثر صفحه‌ای که در یک دور باز می‌شود
  max_detail_pages: 4        # حداکثر صفحه‌ی پروژه که کامل خوانده می‌شود
  max_projects: 4            # سقف پروژه‌های جمع‌آوری‌شده در هر دور
  page_delay_seconds: 1      # فاصله بین درخواست‌ها (مؤدبانه و شبیه انسان)
  # نتیجه‌ی جست‌وجوی قبلی تا این مدت دوباره استفاده می‌شود تا سهمیه‌ی رایگان نسوزد
  reuse_seconds: 600
  # سقف توکن در دقیقه؛ کلاینت مدل قبل از هر درخواست خودش صبر می‌کند تا 429 نگیریم
  tokens_per_minute: 7000
  brief: |
    این سایت «کارلنسر» است، یک سایت فریلنسری ایرانی و تو با حساب کاربری همین فریلنسر وارد شده‌ای.

    ساختار معمول این سایت:
    - برای هر فریلنسر (معمولاً) دو فهرست پروژه وجود دارد: یکی پروژه‌هایی که با
      تخصص ثبت‌شده در پروفایل او هم‌خوان است، و دیگری همه‌ی پروژه‌های باز.
      لینک هر دو در ناوبری/داشبورد هست (با برچسب‌هایی مثل «پروژه‌ها»،
      «پروژه‌های مرتبط»، «همه پروژه‌ها»، «پروژه‌های باز»). اول فهرست مرتبط با
      تخصص را پیدا کن؛ اگر نبود یا کوتاه بود، فهرست همه‌ی پروژه‌های باز را هم ببین.
    - صفحه‌ی پروفایل من (نام کاربری در هدر) مهارت‌ها و تخصص‌های ثبت‌شده را
      نشان می‌دهد. اگر به آن رسیدی بخوانش تا بدانی چه چیزی «مرتبط» است؛
      لازم نیست همه‌ی پروژه‌های آن صفحه را جمع کنی.
    - هر کارت پروژه معمولاً عنوان، بودجه/حق‌الزحمه، زمان تحویل و مهارت‌ها را دارد.
    - صفحه‌ی هر پروژه توضیحات کامل کارفرما، بودجه، مدت زمان مورد نظر کارفرما،
      مهارت‌های لازم، تعداد پیشنهادهای ثبت‌شده و وضعیت پروژه را دارد.
    - پروژه‌های بسته/واگذارشده را جمع نکن؛ فقط پروژه‌های باز و قابل پیشنهاد.

    قاعده‌ی انتخاب: پروژه‌ای جمع کن که (۱) هنوز باز است، (۲) با مهارت‌های همین
    پروفایل هم‌خوانی دارد، و (۳) بودجه‌اش یا اعلام شده یا «توافقی» است. اگر بودجه
    در صفحه نبود، خالی بگذار — عدد از خودت نساز.

# --- listing page -----------------------------------------------------------
list:
  path: "/projects"
  page_param: "page"
  max_pages: 1
  min_items_per_page: 1
  card_selectors:
    - "div.project-item"
    - "article.project-card"
    - "div.project-card"
    - "div.job-card"
    - "li.project-item"
    - "div[class*='project-card']"
    - "[data-testid='project-item']"
  fields:
    title:
      - "h2 a"
      - "h3 a"
      - ".project-title a"
      - "a.project-title"
      - "a[href*='/project']"
    link:
      - "h2 a"
      - "h3 a"
      - ".project-title a"
      - "a.project-title"
      - "a[href*='/project']"
    description:
      - ".project-description"
      - ".description"
      - "p.summary"
      - ".excerpt"
    budget:
      - ".project-budget"
      - ".budget"
      - "[class*='budget']"
      - "[class*='price']"
      - "[class*='amount']"
    skills:
      - ".project-skills .tag"
      - ".skills .tag"
      - ".tags .tag"
      - ".skill"
      - "li.skill"
    category:
      - ".project-category"
      - ".category"
    employer:
      - ".project-owner"
      - ".employer"
      - ".user-name"
    published_at:
      - ".project-date"
      - "time"
      - ".date"
  id_regex: "/projects?/(\\d+)"
  fetch_details: true
  detail_concurrency: 3

detail:
  path: "/project/{external_id}"
  detail_fields:
    description:
      - "#project-description"
      - ".project-description"
      - ".project-detail .description"
      - "div.description"
      - "section.description"
    budget:
      - ".project-budget"
      - ".budget"
      - "[class*='budget']"
      - "[class*='price']"
    skills:
      - ".project-skills .tag"
      - ".skills .tag"
      - "li.skill"
    category:
      - ".project-category"
      - ".category"
    employer:
      - ".project-owner"
      - ".employer"

# --- bidding ----------------------------------------------------------------
bid:
  mode: "form"
  form_selectors:
    - "form#proposal-form"
    - "form#bid-form"
    - "form[action*='proposal']"
    - "form[action*='bid']"
    - "form[action*='offer']"
    - ".proposal-form form"
  fields:
    amount:
      - "input[name*='amount']"
      - "input[name*='price']"
      - "input[name*='budget']"
      - "input[name*='offer']"
    description:
      - "textarea[name*='description']"
      - "textarea[name*='proposal']"
      - "textarea[name*='content']"
      - "textarea[name*='message']"
      - "textarea"
    days:
      - "input[name*='day']"
      - "input[name*='delivery']"
      - "input[name*='duration']"
      - "select[name*='day']"
  include_hidden: true
  success_text_contains:
    - "با موفقیت"
    - "ثبت شد"
    - "ارسال شد"
    - "پیشنهاد شما"
  failure_text_contains:
    - "قبلاً پیشنهاد"
    - "قبلا پیشنهاد"
    - "اعتبار کافی"
    - "امکان ارسال"
    - "خطا"
    - "مجاز نیست"
    - "وارد شوید"
  pre_submit_get: ""

# --- auth -------------------------------------------------------------------
auth:
  mode: "cookie"
  cookie_name: "PHPSESSID"
  # --- checking the saved session (used by /test and after setup) -------------
  # صفحه‌ای که فقط کاربر لاگین‌شده می‌بیند؛ اگر پیدا نشد، صفحه‌ی اصلی امتحان می‌شود.
  check_path: "/dashboard"
  logged_in_markers: ['خروج', 'داشبورد', 'پروفایل من', 'پنل کاربری', 'حساب کاربری']
  login_markers: ['ورود به حساب', 'فراموشی رمز', 'بازیابی رمز']

  login_path: "/login"
  submit_path: "/login"
  username_field: "username"
  password_field: "password"
  parse_hidden: true
