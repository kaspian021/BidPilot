# ============================================================================
# Ponisha (ponisha.ir) — selectors only, no code.
# ----------------------------------------------------------------------------
# اگر ظاهر سایت عوض شد، فقط همین فایل را ویرایش کن:
#   1) در مرورگر صفحه لیست پروژه‌ها را باز کن و یک کارت پروژه را Inspect کن
#   2) با «bidpilot inspect -u https://ponisha.ir/search/projects» ببین
#      کدام سلکتور چند مورد پیدا می‌کند و همان را این‌جا بگذار
# سلکتورها به ترتیب امتحان می‌شوند؛ اولین چیزی که پیدا شود برنده است.
# ============================================================================

base_url: "https://ponisha.ir"

# --- listing page -----------------------------------------------------------
list:
  path: "/search/projects"
  page_param: "page"
  max_pages: 1
  min_items_per_page: 1
  card_selectors:
    - "article.project-card"
    - "div.project-card"
    - "div.project-item"
    - "li.project-item"
    - "div.card.project"
    - "article.job-card"
    - "[data-testid='project-card']"
  fields:
    title:
      - "h2 a"
      - "h3 a"
      - ".project-title a"
      - "a.project-title"
      - "a[href*='/project/']"
    link:
      - "h2 a"
      - "h3 a"
      - ".project-title a"
      - "a.project-title"
      - "a[href*='/project/']"
    description:
      - ".project-description"
      - ".description"
      - "p.summary"
      - ".excerpt"
    budget:
      - ".project-budget"
      - ".budget"
      - "[class*='budget']"
      - "[class*='price']"
      - "[class*='amount']"
    skills:
      - ".project-skills .tag"
      - ".skills .tag"
      - ".tags .tag"
      - ".skill"
      - "li.skill"
    category:
      - ".project-category"
      - ".category"
    employer:
      - ".project-owner"
      - ".employer"
      - ".user-name"
    published_at:
      - ".project-date"
      - "time"
      - ".date"
  id_regex: "/projects?/(\\d+)"
  fetch_details: true
  detail_concurrency: 3

detail:
  path: "/project/{external_id}"
  detail_fields:
    description:
      - "#project-description"
      - ".project-description"
      - ".project-detail .description"
      - "div.description"
      - "section.description"
    budget:
      - ".project-budget"
      - ".budget"
      - "[class*='budget']"
      - "[class*='price']"
    skills:
      - ".project-skills .tag"
      - ".skills .tag"
      - "li.skill"
    category:
      - ".project-category"
      - ".category"
    employer:
      - ".project-owner"
      - ".employer"

# --- bidding ----------------------------------------------------------------
bid:
  mode: "form"
  form_selectors:
    - "form#proposal-form"
    - "form#bid-form"
    - "form[action*='proposal']"
    - "form[action*='bid']"
    - "form[action*='offer']"
    - ".proposal-form form"
  fields:
    amount:
      - "input[name*='amount']"
      - "input[name*='price']"
      - "input[name*='budget']"
      - "input[name*='offer']"
      - "input[name*='fee']"
    description:
      - "textarea[name*='description']"
      - "textarea[name*='proposal']"
      - "textarea[name*='content']"
      - "textarea[name*='message']"
      - "textarea"
    days:
      - "input[name*='day']"
      - "input[name*='delivery']"
      - "input[name*='duration']"
      - "select[name*='day']"
  include_hidden: true
  success_text_contains:
    - "با موفقیت"
    - "ثبت شد"
    - "ارسال شد"
    - "پیشنهاد شما"
  failure_text_contains:
    - "قبلاً پیشنهاد"
    - "قبلا پیشنهاد"
    - "اعتبار کافی"
    - "امکان ارسال"
    - "خطا"
    - "مجاز نیست"
    - "وارد شوید"
  pre_submit_get: ""

# --- auth -------------------------------------------------------------------
auth:
  # "cookie" = کوکی مرورگر (پیشنهادی) | "credentials" = نام کاربری و رمز
  # دستگاه‌ها را در تلگرام با /market وارد کن؛ نیازی به ویرایش این فایل نیست.
  mode: "cookie"
  cookie_name: "PHPSESSID"
  login_path: "/login"
  submit_path: "/login"
  username_field: "username"
  password_field: "password"
  parse_hidden: true
