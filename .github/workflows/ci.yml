name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint & format
        run: |
          ruff check src tests
          ruff format --check src tests

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Compile package (syntax check)
        run: python -m compileall -q src/bidpilot
      - name: Tests
        run: python -m pytest -q
      - name: Smoke test (offline demo)
        run: bidpilot demo

  browser-submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install browser test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,browser]"
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Test browser submission and diagnostic safety
        run: |
          python -m pytest -q tests/test_browser_submit.py tests/test_browser_submit_form.py tests/test_parscoders_parser.py tests/test_debug_bundle.py
      - name: Test admin diagnostics controls
        run: python -m pytest -q tests/test_bot.py -k "admin_browser_debug or non_admin_cannot_open_browser_debug"
